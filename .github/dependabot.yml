version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Vendored into extensions/vendor; bump deliberately with `npm run vendor:unbash`.
      - dependency-name: unbash
      # Must equal the exact version Pi pins, or a second copy breaks schema typing.
      - dependency-name: typebox
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
